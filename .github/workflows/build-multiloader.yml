name: Build TNT Hopper Protect JARs

on:
  push:
    branches: [main]
    paths:
      - 'multiloader/**'
      - '.github/workflows/build-multiloader.yml'
  pull_request:
    paths:
      - 'multiloader/**'
      - '.github/workflows/build-multiloader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [paper, fabric, neoforge, forge]

    defaults:
      run:
        working-directory: multiloader/${{ matrix.loader }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify Gradle version
        run: gradle --version

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload distributable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TNT-Hopper-Protect-${{ matrix.loader }}-26.1.2
          path: |
            multiloader/${{ matrix.loader }}/build/libs/*.jar
            !multiloader/${{ matrix.loader }}/build/libs/*-sources.jar
            !multiloader/${{ matrix.loader }}/build/libs/*-dev.jar
            !multiloader/${{ matrix.loader }}/build/libs/*-shadow.jar
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Bundle successful builds
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: TNT-Hopper-Protect-*-26.1.2
          merge-multiple: true

      - name: Upload combined JAR bundle
        uses: actions/upload-artifact@v4
        with:
          name: TNT-Hopper-Protect-2.0.0-MultiLoader
          path: jars/*.jar
          if-no-files-found: warn
          retention-days: 30
