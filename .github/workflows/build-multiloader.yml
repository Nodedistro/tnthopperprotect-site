name: Build TNT Hopper Protect JARs

on:
  push:
    branches: [main]
    paths:
      - 'multiloader/**'
      - '.github/workflows/build-multiloader.yml'
  pull_request:
    paths:
      - 'multiloader/**'
      - '.github/workflows/build-multiloader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [paper, fabric, neoforge, forge]

    defaults:
      run:
        working-directory: multiloader/${{ matrix.loader }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify Gradle version
        run: gradle --version

      - name: Build Fabric Modrinth JAR
        if: matrix.loader == 'fabric'
        run: gradle clean prepareModrinthJar --stacktrace --no-daemon

      - name: Build non-Fabric loader
        if: matrix.loader != 'fabric'
        run: gradle clean build --stacktrace --no-daemon

      - name: Prepare non-Fabric distributable JAR
        if: success() && matrix.loader != 'fabric'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-shadow.jar' | sort)

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one distributable JAR, found ${#jars[@]}:"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[0]}" "dist/TNT-Hopper-Protect-${{ matrix.loader }}-4.0-mc26.3.jar"

      - name: Verify Fabric Modrinth JAR contents
        if: success() && matrix.loader == 'fabric'
        shell: bash
        run: |
          set -euo pipefail
          jar_file="build/modrinth/TNT-Hopper-Protect-Fabric-4.0+mc26.3.jar"
          test -f "$jar_file"
          jar tf "$jar_file" | tee /tmp/fabric-jar-contents.txt
          grep -qx 'fabric.mod.json' /tmp/fabric-jar-contents.txt
          grep -qx 'tnthopperprotect.mixins.json' /tmp/fabric-jar-contents.txt
          unzip -p "$jar_file" fabric.mod.json

      - name: Upload Fabric verified JAR
        if: success() && matrix.loader == 'fabric'
        uses: actions/upload-artifact@v4
        with:
          name: TNT-Hopper-Protect-fabric-26.3-v4.0
          path: multiloader/fabric/build/modrinth/TNT-Hopper-Protect-Fabric-4.0+mc26.3.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload non-Fabric verified JAR
        if: success() && matrix.loader != 'fabric'
        uses: actions/upload-artifact@v4
        with:
          name: TNT-Hopper-Protect-${{ matrix.loader }}-26.3-v4.0
          path: multiloader/${{ matrix.loader }}/dist/*.jar
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Bundle successful builds
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: TNT-Hopper-Protect-*-26.3-v4.0
          merge-multiple: true

      - name: Upload combined JAR bundle
        uses: actions/upload-artifact@v4
        with:
          name: TNT-Hopper-Protect-4.0-MultiLoader-26.3
          path: jars/*.jar
          if-no-files-found: warn
          retention-days: 30

  publish-modrinth:
    name: Publish jars to Modrinth
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download loader jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: TNT-Hopper-Protect-*-26.3-v4.0
          merge-multiple: true
      - name: Upload new versions to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MOD_VERSION: '4.0'
          MINECRAFT_VERSION: '26.3'
          ARTIFACT_DIR: jars
        run: node scripts/publish-modrinth.cjs
